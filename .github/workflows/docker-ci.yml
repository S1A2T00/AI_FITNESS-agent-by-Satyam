name: Docker CI/CD

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_IMAGE: ai-fitness-agent:${{ github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run existing lint and test scripts if available
        run: |
          npm run lint --if-present
          npm run test --if-present

      - name: Verify application build
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Build Docker image
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Check backend container
        run: |
          set -euo pipefail
          docker run -d --name fitness-smoke \
            -e GEMINI_API_KEY=ci-placeholder-not-a-real-key \
            -p 127.0.0.1:8080:3001 "$LOCAL_IMAGE"
          trap 'docker logs fitness-smoke; docker rm -f fitness-smoke' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/ \
            -o /tmp/fitness-index.html
          grep -q 'id="root"' /tmp/fitness-index.html

      - name: Save Docker image
        run: docker save --output /tmp/fitness-image.tar "$LOCAL_IMAGE"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: fitness-image
          path: /tmp/fitness-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  scan:
    name: Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: fitness-image
          path: /tmp/fitness-image

      - name: Load Docker image
        run: docker load --input /tmp/fitness-image/fitness-image.tar

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  push:
    name: Push
    needs: scan
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: fitness-image
          path: /tmp/fitness-image

      - name: Load Docker image
        run: docker load --input /tmp/fitness-image/fitness-image.tar

      - name: Check publishing credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push versioned and latest images
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/ai-fitness-agent
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$IMAGE_REPOSITORY:${{ github.sha }}"
          docker tag "$LOCAL_IMAGE" "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:${{ github.sha }}"
          docker push "$IMAGE_REPOSITORY:latest"