# Pipeline overview
#
#   PR / push ──► lint ─┐
#                 test ─┼─► build image ─► smoke test ─► Trivy image scan ─► SBOM
#             security ─┘          (Trivy fs: deps + secrets + Dockerfile)
#
#   push to main ──► publish to GHCR (signed, SBOM + provenance) ──► deploy staging
#   tag vX.Y.Z   ──► publish ──► GitHub release ──► deploy production (approval)
#
# Deploys are skipped until the repo variables ENABLE_STAGING_DEPLOY /
# ENABLE_PRODUCTION_DEPLOY are set to "true" (see README → CI/CD).
name: CI/CD

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # Pinned by digest: a tag can be re-pointed, a digest cannot.
  TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
  LOCAL_IMAGE: vitalis:ci-${{ github.sha }}

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests (with PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitalis
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vitalis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitalis"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://vitalis:ci-only@localhost:5432/vitalis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run tests
        run: >-
          node --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=test-results.xml
          "tests/**/*.test.mjs"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  security:
    name: Security scan (npm audit + Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all deps, critical)
        run: npm audit --audit-level=critical

      - name: Trivy cache key
        id: trivy-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ steps.trivy-key.outputs.date }}
          restore-keys: trivy-

      - name: Trivy fs – vulnerabilities, secrets, Dockerfile misconfig (blocking)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs --exit-code 1 --no-progress \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed \
            /src
      - name: Trivy fs – SARIF report
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs --exit-code 0 --no-progress \
            --scanners vuln,secret,misconfig \
            --format sarif --output /src/trivy-fs.sarif /src
      - name: Upload to GitHub Security tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build:
    name: Build, smoke test & scan image
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image must run as non-root
        run: test "$(docker image inspect -f '{{.Config.User}}' "$LOCAL_IMAGE")" = node

      - name: Smoke test (app + PostgreSQL)
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=vitalis -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=vitalis \
            --health-cmd "pg_isready -U vitalis" --health-interval 2s --health-retries 30 \
            postgres:17-alpine
          trap 'docker logs smoke-app || true; docker rm -f smoke-app smoke-db || true' EXIT
          until [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-db)" = healthy ]; do sleep 1; done

          docker run -d --name smoke-app --network smoke --read-only --tmpfs /tmp \
            -e GEMINI_API_KEY=ci-placeholder-not-a-real-key \
            -e FIREBASE_PROJECT_ID=ci-placeholder-project \
            -e FIREBASE_WEB_API_KEY=ci-placeholder \
            -e DATABASE_URL=postgres://vitalis:ci-only@smoke-db:5432/vitalis \
            -p 127.0.0.1:8080:3001 "$LOCAL_IMAGE"

          # The image's own HEALTHCHECK must turn healthy (server + database).
          for _ in $(seq 1 40); do
            s="$(docker inspect -f '{{.State.Health.Status}}' smoke-app)"
            [ "$s" = healthy ] && break
            [ "$s" = unhealthy ] && { echo "container unhealthy"; exit 1; }
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke-app)" = healthy

          curl --fail -s http://127.0.0.1:8080/api/health
          curl --fail -s http://127.0.0.1:8080/ | grep -q 'id="root"'
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/api/coach)"
          test "$code" = 401

      - name: Trivy cache key
        id: trivy-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ steps.trivy-key.outputs.date }}
          restore-keys: trivy-

      - name: Trivy image scan (blocking on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --exit-code 1 --no-progress \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed \
            "$LOCAL_IMAGE"
      - name: Trivy image – SARIF + SBOM
        if: always()
        run: |
          mkdir -p reports
          for args in "--format sarif --output /out/trivy-image.sarif" \
                      "--format cyclonedx --output /out/sbom.cdx.json"; do
            # $args is intentionally unquoted: it holds several flags.
            # shellcheck disable=SC2086
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/reports:/out" \
              "$TRIVY_IMAGE" image --exit-code 0 --no-progress $args "$LOCAL_IMAGE"
          done
      - name: Upload to GitHub Security tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/sbom.cdx.json
          retention-days: 30

  publish:
    name: Publish image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      image: ${{ steps.ref.outputs.image }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Image names
        id: names
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          {
            echo "list<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            # Optional mirror to Docker Hub when its secrets exist.
            if [ -n "$DOCKERHUB_USERNAME" ]; then echo "docker.io/$DOCKERHUB_USERNAME/ai-fitness-agent"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & push (same cache as the scanned build)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$GHCR_IMAGE@$DIGEST"
      - name: Immutable image reference for deploys
        id: ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "image=$GHCR_IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Published \`$GHCR_IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Docker image: \`$IMAGE\`"

  deploy-staging:
    name: Deploy → staging
    needs: publish
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.ENABLE_STAGING_DEPLOY == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
    secrets: inherit

  deploy-production:
    name: Deploy → production
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
    secrets: inherit
