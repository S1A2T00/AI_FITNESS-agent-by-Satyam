# Deploys one image to one Docker host over SSH, using deploy/deploy.sh
# (health-checked, automatic rollback). Called by CI/CD, or run by hand from
# the Actions tab to redeploy any version or roll back.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      image:
        description: "Image to deploy, e.g. ghcr.io/owner/repo:sha-abc1234 (empty with rollback)"
        type: string
        required: false
      rollback:
        description: "Roll back to the previously deployed image instead"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/vitalis' }}
      APP_URL: ${{ vars.APP_URL }}
      IMAGE: ${{ inputs.image }}
      ROLLBACK: ${{ inputs.rollback && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration and inputs
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          set -eu
          [ -n "$DEPLOY_HOST" ] || { echo "::error::Set the DEPLOY_HOST variable on this GitHub environment"; exit 1; }
          [ -n "$DEPLOY_USER" ] || { echo "::error::Set the DEPLOY_USER variable"; exit 1; }
          [ "$HAS_KEY" = true ] || { echo "::error::Set the DEPLOY_SSH_KEY secret"; exit 1; }
          [ "$HAS_KNOWN_HOSTS" = true ] || { echo "::error::Set the DEPLOY_KNOWN_HOSTS secret (ssh-keyscan output)"; exit 1; }
          # These values end up in a remote shell command: allow-list them.
          echo "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$' || { echo "::error::Bad DEPLOY_PATH"; exit 1; }
          if [ "$ROLLBACK" != true ]; then
            echo "$IMAGE" | grep -Eq '^[a-z0-9][a-z0-9._/-]*(:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?$' \
              || { echo "::error::Invalid image reference: '$IMAGE'"; exit 1; }
          fi

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            ConnectTimeout 20
          CFG

      - name: Upload deploy files
        run: |
          # Values are validated above and intentionally expanded locally.
          # shellcheck disable=SC2029
          ssh target "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.prod.yml deploy/deploy.sh deploy/Caddyfile \
              deploy/.env.production.example "target:$DEPLOY_PATH/"

      - name: Log the server in to GHCR (short-lived token)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # Values are validated above and intentionally expanded locally.
          # shellcheck disable=SC2029
          printf '%s' "$TOKEN" | ssh target "docker login ghcr.io -u '$ACTOR' --password-stdin"

      - name: Deploy (health-checked, auto-rollback)
        run: |
          # Values are validated above and intentionally expanded locally.
          # shellcheck disable=SC2029
          if [ "$ROLLBACK" = true ]; then
            ssh target "sh '$DEPLOY_PATH/deploy.sh' --rollback"
          else
            ssh target "sh '$DEPLOY_PATH/deploy.sh' '$IMAGE'"
          fi

      - name: Verify public endpoint
        if: env.APP_URL != ''
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "$APP_URL/api/health"

      - name: Log the server out of GHCR
        if: always()
        run: ssh target "docker logout ghcr.io" || true

      - name: Summary
        if: success()
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          echo "### Deployed to $TARGET_ENV (rollback=$ROLLBACK): \`${IMAGE:-previous image}\`" >> "$GITHUB_STEP_SUMMARY"
