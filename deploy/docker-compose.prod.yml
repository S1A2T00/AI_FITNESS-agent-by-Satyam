# Production stack on a single Docker host. Managed by deploy.sh, which sets
# APP_IMAGE in .env to the exact image the pipeline built and scanned.
#
#   Plain HTTP on :3001      docker compose -f docker-compose.prod.yml up -d
#   HTTPS via Caddy          COMPOSE_PROFILES=https in .env (needs DOMAIN)
name: vitalis

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vitalis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalis -d vitalis"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    logging: *logging
    # No ports: only reachable from the app on the internal network.

  app:
    image: ${APP_IMAGE:?set APP_IMAGE (deploy.sh does this)}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vitalis:${POSTGRES_PASSWORD}@db:5432/vitalis
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # With Caddy in front, keep this on 127.0.0.1. Without it, set
      # APP_PUBLISH=0.0.0.0:3001 in .env.
      - "${APP_PUBLISH:-127.0.0.1:3001}:3001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
