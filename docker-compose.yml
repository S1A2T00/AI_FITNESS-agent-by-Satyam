# Runs the app and PostgreSQL together. Usage:
#   cp .env.example .env.local   (fill in Gemini + Firebase values)
#   docker compose up --build    → http://localhost:3001
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalis}
      POSTGRES_DB: vitalis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # For local `npm run dev:api`. Change POSTGRES_HOST_PORT if 5432 is taken.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalis -d vitalis"]
      interval: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      # Overrides the localhost URL in .env.local with the compose service name.
      DATABASE_URL: postgres://vitalis:${POSTGRES_PASSWORD:-vitalis}@db:5432/vitalis
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  pgdata:
